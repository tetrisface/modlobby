# Submits app/bun.lock to GitHub's dependency graph. The graph reads
# app/package.json but not the lockfile, so without this Dependabot alerts only
# on the npm packages we name. Once submitted, every installed package is
# alerted on, including for advisories published after the submission, so an
# unchanged lockfile needs no scheduled re-audit.
name: dependency-graph

on:
  push:
    branches: [main]
    paths:
      - app/bun.lock
      - app/scripts/dependency-snapshot.ts
      - .github/workflows/dependency-graph.yml
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-24.04
    permissions:
      # The snapshots endpoint requires write.
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      # The script imports nothing, so no install.
      - run: |
          bun app/scripts/dependency-snapshot.ts app/bun.lock |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input -
        env:
          GH_TOKEN: ${{ github.token }}
