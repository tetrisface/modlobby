# Two ways in. The button: blank input bumps the patch version, a typed version
# is used as given. Or a push to main whose commit subject carries `[release]`
# (or `[release 1.2.3]`): this workflow builds while ci tests the same push,
# into a draft release, and publishes the draft only once ci is green. The
# bump is committed and tagged before the build, so the tag names a commit
# whose Cargo.toml already states its own version, and
# `git checkout v<x> && cargo build` reproduces the shipped version string.
#
# Five jobs: `gate` decides whether this run releases and which version;
# `tag` bumps, tags and opens the GitHub release as a draft; `build` runs once
# per platform (Windows NSIS; Linux AppImage and .deb; macOS .app and
# .dmg, signed with a self-signed certificate -- a Developer ID certificate
# carries its holder's name) and each attaches its bundles, .sig
# files and latest.json to that draft, then versionless copies of the
# bundles. tauri-action merges the `platforms` map of an existing latest.json
# rather than replacing it. `publish` waits for ci on the pushed commit and
# makes the draft the latest release: nothing is visible to an updater until
# every platform is in the manifest. `aur` then publishes the Arch package
# from the .deb.
#
# A red ci leaves the bump on main, the tag and the draft behind. Rerun ci and
# then the `publish` job if it was a flake; otherwise delete the draft and its
# tag, and the next release takes the next number.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (blank: patch + 1)"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write
  # `publish` reads the ci run of the same push.
  actions: read

# Two releases racing on main would both bump and both tag. Every push to
# main also lands here, so a non-release push queues behind a running release
# before `gate` lets it out.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only the subject line counts.
          subject=$(head -n1 <<<"$MESSAGE")
          if ! [[ "$subject" =~ \[release( ([0-9]+\.[0-9]+\.[0-9]+))?\] ]]; then
            echo "not a release commit: $subject"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

  tag:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    outputs:
      next: ${{ steps.version.outputs.next }}
      commit: ${{ steps.bump.outputs.commit }}
    steps:
      # A branch, not the detached HEAD workflow_dispatch checks out by
      # default: the version bump is pushed to main.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      # ci verifies the pushed commit; release that one, not whatever main is now.
      - name: main is still the pushed commit
        if: github.event_name == 'push'
        run: |
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] ||
            { echo "main moved past $GITHUB_SHA; push [release] again or use the button"; exit 1; }

      - name: Next version
        id: version
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          id=$(cargo pkgid -p modlobby-app)
          current=${id##*@}
          next=$VERSION
          if [ -z "$next" ]; then
            IFS=. read -r major minor patch <<<"$current"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "$current -> $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      # tauri-action is told to look for a draft, and handed a published
      # release it opens a second one on the same tag. Before anything is pushed.
      - name: Not already published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          [ "$(gh release view "v$NEXT" --json isDraft -q .isDraft 2>/dev/null)" != false ] ||
            { echo "v$NEXT is already published; release the next version"; exit 1; }

      - name: Bump, commit, tag
        id: bump
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          sed -i "0,/^version = \".*\"$/s//version = \"$NEXT\"/" Cargo.toml
          cargo update -w
          id=$(cargo pkgid -p modlobby-app)
          [ "${id##*@}" = "$NEXT" ] || { echo "Cargo.toml did not take $NEXT: $id"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A build that failed after the bump left main and the tag in place;
          # dispatching again with the same version resumes from there, while
          # the release is still a draft. The push refuses a tag that already
          # names a different commit, and `--atomic` then refuses main with it:
          # never a tag off main, never a bump on main without its tag.
          git diff --quiet || git commit -am "release $NEXT"
          git tag -f "v$NEXT"
          git push --atomic origin main "v$NEXT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The release exists before any builder starts, so the parallel
      # tauri-action runs all find it by tag instead of racing to create it.
      # Re-dispatching the same version finds the draft already there. A draft
      # is not `latest`, so no updater sees it before `publish`.
      - name: Open the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: |
          gh release view "v$NEXT" >/dev/null 2>&1 ||
            gh release create "v$NEXT" --draft --title "$NEXT" --notes "$NEXT+$COMMIT"

  build:
    needs: tag
    strategy:
      # One platform failing must not cancel the others' uploads.
      fail-fast: false
      matrix:
        # 22.04 is the oldest glibc the runners offer: widest AppImage reach.
        # macos-15 is Apple Silicon, which is the only architecture the engine
        # modlobby fetches exists for: an Intel slice would ship a lobby that
        # cannot start a game.
        os: [windows-2022, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # `tauri::generate_context!` brotli-compresses the whole front end at
      # quality 9 inside a proc macro, and a release build compiles proc
      # macros unoptimised unless told otherwise. Here rather than in
      # Cargo.toml: the optimised macros are cached, a local build would only
      # pay for them.
      CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_OPT_LEVEL: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.tag.outputs.next }}

      - name: WebKitGTK and bundler libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # rustup reads rust-toolchain.toml on the first cargo call; no action needed.
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.8.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: app

      # An ad-hoc signature is the binary's hash, so the keychain's "Always
      # Allow" for the saved password named only the build it was clicked in
      # and every update asked again. Signed with one certificate, the
      # designated requirement is `certificate root = H"<its hash>"`, the same
      # for every release. Gatekeeper still warns on the first download;
      # losing the .p12 costs every user one more prompt. tauri-action's own
      # APPLE_CERTIFICATE import only accepts Apple-issued names, so the
      # certificate goes into a keychain here and tauri finds it by name on
      # the search list. codesign rejects an untrusted self-signed identity
      # ("no identity found"); trusting it without sudo waits on a dialog.
      - name: Signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$MACOS_CERTIFICATE" ] || { echo "secret MACOS_CERTIFICATE is not set"; exit 1; }
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 16)
          base64 --decode <<<"$MACOS_CERTIFICATE" > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security find-certificate -c modlobby -p "$keychain" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/cert.pem"
          # shellcheck disable=SC2046 # one argument per existing keychain
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep '"modlobby"'
          echo "APPLE_SIGNING_IDENTITY=modlobby" >> "$GITHUB_ENV"

      # Builds the platform's bundle (tauri.conf.json names nsis,
      # tauri.linux.conf.json overrides that with appimage, deb and rpm, and
      # tauri.macos.conf.json with app and dmg; `args` below leaves the rpm
      # out: 45 s of bundling for a format with no downloads in thirty
      # releases, and the updater only ever serves the AppImage), signs the updater
      # artifact, and attaches bundle, .sig and latest.json to the release. No
      # submodule is needed: the one file compiled in from external/ is only
      # read under #[cfg(test)].
      - uses: tauri-apps/tauri-action@v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MODLOBBY_COMMIT: ${{ needs.tag.outputs.commit }}
        with:
          projectPath: app
          tauriScript: bun run tauri
          tagName: v${{ needs.tag.outputs.next }}
          releaseName: ${{ needs.tag.outputs.next }}
          # A draft cannot be fetched by tag; this makes the action look for it.
          releaseDraft: true
          args: ${{ runner.os == 'Linux' && '--bundles appimage,deb' || '' }}

      # The same bundles again under names without the version, so the README
      # links /releases/latest/download/<name> and never goes stale. The .sig
      # files and latest.json keep naming the versioned ones.
      - name: Versionless copies for the README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ needs.tag.outputs.next }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          mkdir -p latest
          jq -r '.[]' <<<"$ARTIFACTS" | tr -d '\r' | while read -r path; do
            case "$path" in
              *.exe) name=modlobby_x64-setup.exe ;;
              *.AppImage) name=modlobby_amd64.AppImage ;;
              *.deb) name=modlobby_amd64.deb ;;
              *.dmg) name=modlobby_aarch64.dmg ;;
              *) continue ;;
            esac
            cp "$path" "latest/$name"
          done
          gh release upload "v$NEXT" latest/* --clobber

  # Whole or not at all: every platform built, and ci green on the commit that
  # was pushed. ci started with this workflow and is normally long done by
  # now. The button has no push to wait for and publishes as it always did.
  publish:
    needs: [tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      NEXT: ${{ needs.tag.outputs.next }}
    steps:
      - name: ci is green on the pushed commit
        if: github.event_name == 'push'
        run: |
          id=$(gh run list --workflow ci.yml --event push --commit "$GITHUB_SHA" --json databaseId -q '.[0].databaseId')
          [ -n "$id" ] || { echo "no ci run for $GITHUB_SHA"; exit 1; }
          until [ "$(gh run view "$id" --json status -q .status)" = completed ]; do sleep 15; done
          conclusion=$(gh run view "$id" --json conclusion -q .conclusion)
          [ "$conclusion" = success ] ||
            { echo "ci was $conclusion: v$NEXT stays a draft. Rerun ci and this job, or delete the draft and its tag."; exit 1; }

      - run: gh release edit "v$NEXT" --draft=false --latest

  # The Arch package: packaging/aur/PKGBUILD with this release's version,
  # checksummed and test-built in an Arch container, then pushed to
  # aur.archlinux.org. Needs an AUR account whose SSH key is in the secrets;
  # without AUR_SSH_PRIVATE_KEY the job stops after printing the PKGBUILD.
  aur:
    # After `publish`: the PKGBUILD's source is the release's public download
    # URL, which a draft does not have.
    needs: [tag, publish]
    runs-on: ubuntu-24.04
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.tag.outputs.next }}

      - name: The .deb is on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ needs.tag.outputs.next }}
        run: gh release view "v$NEXT" --json assets -q '.assets[].name' | grep -x "modlobby_${NEXT}_amd64.deb"

      - name: PKGBUILD for this version
        env:
          NEXT: ${{ needs.tag.outputs.next }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=$NEXT/" packaging/aur/PKGBUILD
          cat packaging/aur/PKGBUILD

      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        if: ${{ env.AUR_SSH_PRIVATE_KEY != '' }}
        with:
          pkgname: modlobby-bin
          pkgbuild: packaging/aur/PKGBUILD
          updpkgsums: true
          test: true
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ needs.tag.outputs.next }}
