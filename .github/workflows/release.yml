# One button. Blank input bumps the patch version; a typed version is used as
# given. The bump is committed and tagged before the build, so the tag names a
# commit whose Cargo.toml already states its own version, and
# `git checkout v<x> && cargo build` reproduces the shipped version string.
#
# Two jobs: `tag` bumps, tags and opens the GitHub release; `build` runs once
# per platform (Windows NSIS, Linux AppImage; mac waits for a Recoil build)
# and each attaches its own bundle, .sig and latest.json to that release as
# soon as it finishes. tauri-action merges the `platforms` map of an existing
# latest.json rather than replacing it, so the manifest fills in one platform
# at a time. A client whose platform is not in the manifest yet sees a
# transient "no update for this target" — the same class of window as the 404
# before the first upload.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (blank: patch + 1)"
        required: false
        default: ""

permissions:
  contents: write

# Two releases racing on main would both bump and both tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      next: ${{ steps.version.outputs.next }}
      commit: ${{ steps.bump.outputs.commit }}
    steps:
      # A branch, not the detached HEAD workflow_dispatch checks out by
      # default: the version bump is pushed to main.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Next version
        id: version
        run: |
          id=$(cargo pkgid -p modlobby-app)
          current=${id##*@}
          next='${{ inputs.version }}'
          if [ -z "$next" ]; then
            IFS=. read -r major minor patch <<<"$current"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "$current -> $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Bump, commit, tag
        id: bump
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          sed -i "0,/^version = \".*\"$/s//version = \"$NEXT\"/" Cargo.toml
          cargo update -w
          id=$(cargo pkgid -p modlobby-app)
          [ "${id##*@}" = "$NEXT" ] || { echo "Cargo.toml did not take $NEXT: $id"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A build that failed after the bump left main and the tag in place;
          # dispatching again with the same version resumes from there. The
          # push refuses a tag that already names a different commit.
          git diff --quiet || git commit -am "release $NEXT"
          git tag -f "v$NEXT"
          git push origin main "v$NEXT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The release exists before any builder starts, so the parallel
      # tauri-action runs all find it by tag instead of racing to create it.
      # Re-dispatching the same version finds the release already there.
      - name: Open the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: |
          gh release view "v$NEXT" >/dev/null 2>&1 ||
            gh release create "v$NEXT" --title "$NEXT" --notes "$NEXT+$COMMIT"

  build:
    needs: tag
    strategy:
      # One platform failing must not cancel the others' uploads.
      fail-fast: false
      matrix:
        # 22.04 is the oldest glibc the runners offer: widest AppImage reach.
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.tag.outputs.next }}

      - name: WebKitGTK and bundler libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # rustup reads rust-toolchain.toml on the first cargo call; no action needed.
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.8.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: app

      # Builds the platform's bundle (tauri.conf.json names nsis,
      # tauri.linux.conf.json overrides that with appimage), signs the updater
      # artifact, and attaches bundle, .sig and latest.json to the release. No
      # submodule is needed: the one file compiled in from external/ is only
      # read under #[cfg(test)].
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MODLOBBY_COMMIT: ${{ needs.tag.outputs.commit }}
        with:
          projectPath: app
          tauriScript: bun run tauri
          tagName: v${{ needs.tag.outputs.next }}
          releaseName: ${{ needs.tag.outputs.next }}
