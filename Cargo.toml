[workspace]
resolver = "3"
members = ["crates/spring-protocol", "crates/lobby-core", "crates/recoil", "crates/modlobby-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"

[workspace.dependencies]
spring-protocol = { path = "crates/spring-protocol" }
lobby-core = { path = "crates/lobby-core" }
recoil = { path = "crates/recoil" }

anyhow = "=1.0.104"
base64 = "=0.23.1"
clap = { version = "=4.6.6", features = ["derive", "env"] }
dotenvy = "=0.15.7"
md-5 = "=0.11.0"
rand = "=0.10.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sysinfo = "=0.39.6"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util", "signal", "process"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
webpki-roots = "=1.0.9"
