[workspace]
resolver = "3"
members = [
    "crates/spring-protocol",
    "crates/lobby-core",
    "crates/lobby-ui",
    "crates/lobby-runtime",
    "crates/settings",
    "crates/recoil",
    "crates/modlobby-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"

[workspace.dependencies]
spring-protocol = { path = "crates/spring-protocol" }
lobby-core = { path = "crates/lobby-core" }
lobby-runtime = { path = "crates/lobby-runtime" }
lobby-ui = { path = "crates/lobby-ui" }
settings = { path = "crates/settings" }
recoil = { path = "crates/recoil" }

anyhow = "=1.0.104"
base64 = "=0.23.1"
clap = { version = "=4.6.6", features = ["derive", "env"] }
directories = "=6.0.0"
dotenvy = "=0.15.7"
jsonc-parser = { version = "=0.33.1", features = ["cst", "serde"] }
keyring = "=4.1.6"
md-5 = "=0.11.0"
notify = "=8.2.0"
rand = "=0.10.2"
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sysinfo = "=0.39.6"
tauri = { version = "=2.11.5", features = [] }
tauri-build = { version = "=2.6.3", features = [] }
tauri-plugin-opener = "=2.5.4"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util", "signal", "process"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
ts-rs = "=12.0.1"
webpki-roots = "=1.0.9"
