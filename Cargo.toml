[workspace]
resolver = "3"
members = [
    "crates/spring-protocol",
    "crates/content",
    "crates/lobby-core",
    "crates/lobby-ui",
    "crates/lobby-runtime",
    "crates/settings",
    "crates/tweaks",
    "crates/modoptions",
    "crates/presets",
    "crates/startbox",
    "crates/pve",
    "crates/recoil",
    "crates/modlobby-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"

[workspace.dependencies]
spring-protocol = { path = "crates/spring-protocol" }
lobby-core = { path = "crates/lobby-core" }
lobby-runtime = { path = "crates/lobby-runtime" }
lobby-ui = { path = "crates/lobby-ui" }
settings = { path = "crates/settings" }
presets = { path = "crates/presets" }
startbox = { path = "crates/startbox" }
pve = { path = "crates/pve" }
tweaks = { path = "crates/tweaks" }
modoptions = { path = "crates/modoptions" }
recoil = { path = "crates/recoil" }

anyhow = "=1.0.104"
base64 = "=0.23.1"
clap = { version = "=4.6.6", features = ["derive", "env"] }
content = { path = "crates/content" }
directories = "=6.0.0"
dotenvy = "=0.15.7"
flate2 = "=1.1.10"
full_moon = "=2.2.0"
jsonc-parser = { version = "=0.33.1", features = ["cst", "serde"] }
keyring = "=4.1.6"
md-5 = "=0.11.0"
notify = "=8.2.0"
rand = "=0.10.2"
schemars = "=1.2.2"
sha2 = "=0.11.0"
similar = "=3.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
stylua = { version = "=2.5.2", default-features = false }
sysinfo = "=0.39.6"
tauri = { version = "=2.11.5", features = [] }
tauri-build = { version = "=2.6.3", features = [] }
tauri-plugin-notification = "=2.3.3"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-window-state = "=2.4.1"
tauri-plugin-updater = "=2.11.0"
# Engine builds ship as .7z, and the one archive modlobby unpacks itself is an
# engine — everything else arrives through pr-downloader, which unpacks its own.
sevenz-rust2 = "=0.22.2"
# `rustls-no-provider`, not `rustls`: the plain feature drags in aws-lc-rs as
# a second crypto provider beside the ring one tokio-rustls uses, and rustls
# PANICS at connect time when two providers are compiled in and no process
# default is installed — which surfaced as "client stopped" on login. One
# provider (ring, installed at startup) serves both the lobby connection and
# every HTTPS fetch.
reqwest = { version = "=0.13.4", default-features = false, features = [
  "json",
  "rustls-no-provider",
] }
windows-sys = "=0.61.2"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util", "fs", "signal", "process"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
ts-rs = "=12.0.1"
webpki-roots = "=1.0.9"
