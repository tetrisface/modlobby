[package]
name = "modlobby-app"
description = "modlobby desktop app: a Tauri shell over lobby-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "modlobby_app_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# A download kept between runs is held to the release signature again before
# it is installed: the updater checks one only as it downloads.
base64 = { workspace = true }
minisign-verify = { workspace = true }
content = { workspace = true }
# The start's logins, side by side: `join_all`.
futures-util = { workspace = true }
md-5 = { workspace = true }
percent-encoding = { workspace = true }
recoil = { workspace = true }
lan = { workspace = true }
skirmish = { workspace = true }
lobby-runtime = { workspace = true }
news = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
sevenz-rust2 = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
tokio = { workspace = true }
lobby-ui = { workspace = true }
serde = { workspace = true }
# `generate_context!` embeds the `plugins` section as a `serde_json::Value`.
serde_json = { workspace = true }
settings = { workspace = true }
spring-protocol = { workspace = true }
startbox = { workspace = true }
tauri = { workspace = true }
modoptions = { workspace = true }
presets = { workspace = true }
pve = { workspace = true }
widgets = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-updater = { workspace = true }
# Registered in debug builds only, see `lib.rs`.
tauri-plugin-mcp-bridge = { workspace = true }
dotenvy = { workspace = true }
tweaks = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
ts-rs = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Only for the engine's window, which we do not own: flashing its taskbar
# entry, putting it in front, and asking which monitor it is on.
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
