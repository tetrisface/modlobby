[package]
name = "modlobby-app"
description = "modlobby desktop app: a Tauri shell over lobby-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "modlobby_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
content = { workspace = true }
md-5 = { workspace = true }
recoil = { workspace = true }
lobby-runtime = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
sevenz-rust2 = { workspace = true }
tokio = { workspace = true }
lobby-ui = { workspace = true }
serde = { workspace = true }
# `generate_context!` embeds the `plugins` section as a `serde_json::Value`.
serde_json = { workspace = true }
settings = { workspace = true }
spring-protocol = { workspace = true }
startbox = { workspace = true }
tauri = { workspace = true }
modoptions = { workspace = true }
presets = { workspace = true }
pve = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-updater = { workspace = true }
dotenvy = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Only to flash the engine's taskbar entry, which is a window we do not own.
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
tweaks = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
