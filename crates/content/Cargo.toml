[package]
name = "content"
description = "What this machine has installed: engines, games via the rapid index, and maps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
flate2 = { workspace = true }
image = { workspace = true }
md-5 = { workspace = true }
recoil = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# Only for the crypto provider reqwest's rustls needs installed before a client can be built.
tokio-rustls = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }
# The Apple Silicon engine ships as a zip of an .app; every other engine
# arrives as the 7z BAR's index publishes, which `sevenz-rust2` unpacks in the
# shell. Already in the tree by way of `tauri-plugin-updater`.
zip = { workspace = true }

[dev-dependencies]
# Only for the example that reads a real install.
modoptions = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
